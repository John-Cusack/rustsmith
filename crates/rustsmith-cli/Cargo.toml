[package]
name = "rustsmith-cli"
version.workspace = true
edition = "2021"
description = "Rustsmith command-line harness for measured library porting"
license.workspace = true
repository.workspace = true

[[bin]]
name = "rustsmith"
path = "src/main.rs"

[dependencies]
rustsmith-core = { version = "0.1.0", path = "../rustsmith-core" }
rustsmith-store = { version = "0.1.0", path = "../rustsmith-store" }
rustsmith-oracle = { version = "0.1.0", path = "../rustsmith-oracle" }
rustsmith-gates = { version = "0.1.0", path = "../rustsmith-gates" }
rustsmith-sandbox = { version = "0.1.0", path = "../rustsmith-sandbox" }
rustsmith-agent = { version = "0.1.0", path = "../rustsmith-agent" }
rustsmith-council = { version = "0.1.0", path = "../rustsmith-council" }
rustsmith-adapters = { version = "0.1.0", path = "../rustsmith-adapters" }
rustsmith-profile = { version = "0.1.0", path = "../rustsmith-profile" }
rustsmith-harvest = { version = "0.1.0", path = "../rustsmith-harvest" }
rustsmith-report = { version = "0.1.0", path = "../rustsmith-report" }
serde_json = { workspace = true }
walkdir = { workspace = true }
camino = "1"
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
