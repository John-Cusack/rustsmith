[package]
name = "rustsmith-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustsmith"
path = "src/main.rs"

[dependencies]
rustsmith-core = { path = "../rustsmith-core" }
rustsmith-store = { path = "../rustsmith-store" }
rustsmith-oracle = { path = "../rustsmith-oracle" }
rustsmith-gates = { path = "../rustsmith-gates" }
rustsmith-sandbox = { path = "../rustsmith-sandbox" }
rustsmith-agent = { path = "../rustsmith-agent" }
rustsmith-council = { path = "../rustsmith-council" }
rustsmith-adapters = { path = "../rustsmith-adapters" }
rustsmith-profile = { path = "../rustsmith-profile" }
rustsmith-harvest = { path = "../rustsmith-harvest" }
rustsmith-report = { path = "../rustsmith-report" }
serde_json = { workspace = true }
walkdir = { workspace = true }
camino = "1"
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
