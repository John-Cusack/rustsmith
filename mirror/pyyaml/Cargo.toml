[package]
name = "pyyaml-rust"
version = "6.0.2"
edition = "2021"
description = "Pure-Rust YAML 1.1 engine with Python bindings (rustsmith Stage-1 mirror of yaml/pyyaml)"
license = "MIT"
repository = "https://github.com/John-Cusack/yaml-rust"
homepage = "https://github.com/yaml/pyyaml"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
yaml-rust-core = { path = "yaml-core", version = "6.0.2" }
pyo3 = { version = "0.23", features = ["extension-module"] }

[workspace]
members = ["yaml-core"]
