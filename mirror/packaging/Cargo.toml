[package]
name = "packaging-rust"
version = "26.4.0"
edition = "2021"
description = "Pure-Rust packaging core with Python bindings (rustsmith Stage-1 mirror of pypa/packaging)"
license = "Apache-2.0 OR BSD-2-Clause"
repository = "https://github.com/John-Cusack/packaging-rust"
homepage = "https://github.com/pypa/packaging"

[lib]
name = "_packaging"
crate-type = ["cdylib"]

[dependencies]
packaging-rust-core = { path = "packaging-core", version = "26.4.0" }
pyo3 = { version = "0.23", features = ["macros"] }

[workspace]
members = ["packaging-core"]
