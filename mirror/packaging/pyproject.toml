[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "packaging-rust"
version = "26.4.0"
description = "Pure-Rust packaging utilities (rustsmith Stage-1 mirror of pypa/packaging)"
authors = [{ name = "Donald Stufft and individual contributors" }]
requires-python = ">=3.9"
readme = "README.md"
license = "Apache-2.0 OR BSD-2-Clause"
keywords = ["packaging", "version", "rust"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: Apache Software License",
  "License :: OSI Approved :: BSD License",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/John-Cusack/packaging-rust"
Upstream = "https://github.com/pypa/packaging"

[tool.maturin]
module-name = "packaging._packaging"
bindings = "pyo3"
features = ["pyo3/extension-module"]
# The reusable Rust core ships inside the sdist as a path dependency
# (verified by `release-prep`: the sdist rebuild test builds the wheel
# from the unpacked sdist with no network checkout).
sdist-include = ["packaging-core/**/*", "NOTICE", "release.toml"]

# Test config preserved verbatim from the original (frozen oracle owns this).
[tool.pytest.ini_options]
minversion = "6.2"
addopts = [
    "-ra",
    "--showlocals",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not property",
    "--capture=sys",
    "-p",
    "no:logging",
]
