# Release configuration for the `pygments` converted project.
#
# This file is the single source of truth for publishing the rustsmith output
# as a reusable Rust core crate (crates.io) plus a Python package calling that
# same core (PyPI). `rustsmith release-prep --project mirror/pygments ...`
# reads it; every name/version here MUST match the manifests below or prep
# fails. Copied from `mirror/pyparsing/release.toml`; field meanings
# are documented in `docs/RELEASE.md`.

[release]
schema = 1
# Original package identity (matches `template.json` `package` and recon facts).
project = "pygments"
# Rust core crate published to crates.io (`pygments-core/Cargo.toml [package] name`).
rust_crate = "pygments-rust-core"
# Python distribution published to PyPI (`pyproject.toml [project] name`).
# MUST differ from `project`: the original name stays with upstream.
pypi_dist = "pygments-rust"
# Python import name. MUST equal the package's import name: users swap the
# install with zero import changes (`pip install pygments-rust`
# still does `import pygments`).
python_import = "pygments"
# Release version. MUST equal `[package] version` in `Cargo.toml`,
# `pygments-core/Cargo.toml`, and `[project] version` in `pyproject.toml`.
# Snapshot of upstream 2.19.1 at port time.
version = "2.19.1"
# Supported Python versions (workflow matrix) and the matching floor.
requires_python = ">=3.8"
python_versions = ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
# GitHub runners the release workflow builds and tests on.
platforms = ["ubuntu-22.04", "macos-14", "windows-2022"]

# Publishing repository and workflow identity (trusted publishing, no tokens).
# The repo below is the publishing home for the converted project: create it,
# push the prepared tree, then register the trusted publishers.
github_repo = "John-Cusack/pygments-rust"
release_workflow = ".github/workflows/release.yml"
pypi_environment = "pypi"
testpypi_environment = "testpypi"

# License and upstream attribution.
license_spdx = "BSD-2-Clause"
upstream = "pygments/pygments"
upstream_url = "https://github.com/pygments/pygments"
upstream_license = "BSD-2-Clause"
upstream_authors = "Georg Brandl and the Pygments team"

# Smoke checks run against the installed wheel (Python expressions; each is
# evaluated as `import pygments; assert <expr>`, so submodules need an
# explicit import inside the expression: upstream `pygments/__init__.py`
# only exposes `lex`/`format`/`highlight`/`__version__`). Kept to
# stdlib-only, deterministic vectors; the last one proves the compiled
# Rust core (`pygments._pygments`) ships inside the wheel.
smoke_exprs = [
  "len(list(pygments.lex('print(1)\\n', __import__('pygments.lexers', fromlist=['x']).get_lexer_by_name('python')))) > 0",
  "pygments.format([(__import__('pygments.token', fromlist=['x']).Keyword, 'if')], __import__('pygments.formatters', fromlist=['x']).get_formatter_by_name('html')) != ''",
  "__import__('pygments.lexers', fromlist=['x']).get_lexer_by_name('python').name == 'Python'",
  "__import__('pygments.formatters', fromlist=['x']).get_formatter_by_name('html').name == 'HTML'",
  "len(pygments.__version__) > 0",
  "__import__('pygments._pygments', fromlist=['x']) is not None",
]
