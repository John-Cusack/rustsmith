[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pygments-rust"
version = "2.19.1"
description = "Pygments syntax highlighting with hot text kernels in Rust (rustsmith Stage-1 mirror of pygments/pygments)"
authors = [{ name = "Georg Brandl", email = "georg@python.org" }]
maintainers = [{ name = "rustsmith" }]
requires-python = ">=3.8"
readme = "README.md"
license = "BSD-2-Clause"
keywords = ["syntax highlighting", "lexer", "rust"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/John-Cusack/pygments-rust"
Upstream = "https://github.com/pygments/pygments"

[tool.maturin]
module-name = "pygments._pygments"
bindings = "pyo3"
features = ["pyo3/extension-module"]
# The reusable Rust core ships inside the sdist as a path dependency
# (verified by `release-prep`: the sdist rebuild test builds the wheel
# from the unpacked sdist with no network checkout).
sdist-include = ["pygments-core/**/*", "NOTICE", "release.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
