[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "markdown-it-rust"
version = "4.2.0"
description = "Markdown parsing, done right! (rustsmith Stage-1 Rust mirror of executablebooks/markdown-it-py)"
authors = [{ name = "Chris Sewell" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
keywords = ["markdown", "lexer", "parser", "commonmark", "markdown-it"]
# NOTE: upstream imports `typing_extensions` at runtime (`utils.py`) without
# declaring it; the port declares it so fresh installs work.
dependencies = [
    "mdurl~=0.1",
    "typing_extensions>=4",
]

[project.urls]
Homepage = "https://github.com/John-Cusack/markdown-it-rust"
Upstream = "https://github.com/executablebooks/markdown-it-py"

[project.scripts]
markdown-it = "markdown_it.cli.parse:main"

[tool.maturin]
module-name = "markdown_it._markdown_it"
bindings = "pyo3"
features = ["pyo3/extension-module"]
# The reusable Rust core ships inside the sdist as a path dependency
# (verified by `release-prep`: the sdist rebuild test builds the wheel
# from the unpacked sdist with no network checkout).
sdist-include = ["markdown-it-core/**/*", "NOTICE", "release.toml"]

# Test config preserved verbatim from the original (frozen oracle owns this).
[tool.pytest.ini_options]
xfail_strict = true
timeout = 10
