[package]
name = "markdown-it-rust-core"
version = "4.2.0"
edition = "2021"
description = "Pure-Rust markdown-it core (rustsmith Stage-1 mirror of executablebooks/markdown-it-py); no Python dependency"
license = "MIT"
repository = "https://github.com/John-Cusack/markdown-it-rust"
homepage = "https://github.com/executablebooks/markdown-it-py"

[lib]
name = "markdown_it_rust_core"
crate-type = ["rlib"]

[dependencies]
regex = "1"
