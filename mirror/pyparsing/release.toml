# Release configuration for the `pyparsing` converted project.
#
# This file is the single source of truth for publishing the rustsmith output
# as a reusable Rust core crate (crates.io) plus a Python package calling that
# same core (PyPI). `rustsmith release-prep --project mirror/pyparsing ...`
# reads it; every name/version here MUST match the manifests below or prep
# fails. Copied from `mirror/python-multipart/release.toml`; field meanings
# are documented in `docs/RELEASE.md`.

[release]
schema = 1
# Original package identity (matches `template.json` `package` and recon facts).
project = "pyparsing"
# Rust core crate published to crates.io (`pyparsing-core/Cargo.toml [package] name`).
rust_crate = "pyparsing-rust-core"
# Python distribution published to PyPI (`pyproject.toml [project] name`).
# MUST differ from `project`: the original name stays with upstream.
pypi_dist = "pyparsing-rust"
# Python import name. MUST equal the package's import name: users swap the
# install with zero import changes (`pip install pyparsing-rust`
# still does `import pyparsing`).
python_import = "pyparsing"
# Release version. MUST equal `[package] version` in `Cargo.toml`,
# `pyparsing-core/Cargo.toml`, and `[project] version` in `pyproject.toml`.
# Snapshot of upstream 3.3.3 at port time.
version = "3.3.3"
# Supported Python versions (workflow matrix) and the matching floor.
requires_python = ">=3.9"
python_versions = ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
# GitHub runners the release workflow builds and tests on.
platforms = ["ubuntu-22.04", "macos-14", "windows-2022"]

# Publishing repository and workflow identity (trusted publishing, no tokens).
# The repo below is the publishing home for the converted project: create it,
# push the prepared tree, then register the trusted publishers.
github_repo = "John-Cusack/pyparsing-rust"
release_workflow = ".github/workflows/release.yml"
pypi_environment = "pypi"
testpypi_environment = "testpypi"

# License and upstream attribution.
license_spdx = "MIT"
upstream = "pyparsing/pyparsing"
upstream_url = "https://github.com/pyparsing/pyparsing"
upstream_license = "MIT"
upstream_authors = "Paul McGuire"

# Smoke checks run against the installed wheel (Python expressions; each must
# evaluate truthy). Kept to stdlib-only, deterministic vectors.
smoke_exprs = [
  "pyparsing.Word(pyparsing.alphas).parse_string('abc')[0] == 'abc'",
  "list(pyparsing.CharsNotIn(';').parse_string('ab;cd')) == ['ab']",
  "pyparsing.White(' ').parse_string('   x')[0] == '   '",
  "list(pyparsing.DelimitedList(pyparsing.CharsNotIn(';'), delim=';').parse_string('a;b')) == ['a', 'b']",
  "len(pyparsing.__version__) > 0",
]
