[package]
name = "python-multipart-rust"
version = "0.0.32"
edition = "2021"
description = "Pure-Rust multipart parsing with Python bindings (rustsmith Stage-1 mirror of Kludex/python-multipart)"
license = "Apache-2.0"
repository = "https://github.com/John-Cusack/python_multipart-rust"
homepage = "https://github.com/Kludex/python-multipart"

[lib]
name = "_python_multipart"
crate-type = ["cdylib"]

[dependencies]
multipart-rust-core = { path = "python_multipart-core", version = "0.0.32" }
pyo3 = { version = "0.23", features = ["macros"] }

[workspace]
members = ["python_multipart-core"]
