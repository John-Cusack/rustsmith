[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "python-multipart-rust"
version = "0.0.32"
description = "A streaming multipart parser for Python (rustsmith Stage-1 mirror of Kludex/python-multipart)"
authors = [{ name = "Andrew Dunham" }]
maintainers = [{ name = "Marcelo Trylesinski" }]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
keywords = ["multipart", "parser", "rust"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/John-Cusack/python-multipart-rust"
Upstream = "https://github.com/Kludex/python-multipart"

[tool.maturin]
module-name = "python_multipart._python_multipart"
bindings = "pyo3"
features = ["pyo3/extension-module"]
# The reusable Rust core ships inside the sdist as a path dependency
# (verified by `release-prep`: the sdist rebuild test builds the wheel
# from the unpacked sdist with no network checkout).
sdist-include = ["multipart-core/**/*", "NOTICE", "release.toml"]

# Test config preserved verbatim from the original (frozen oracle owns this).
[tool.coverage.run]
branch = false
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100
skip_covered = true
show_missing = true
exclude_also = [
  "def __repr__",
  "if __name__ == .__main__.:",
]
