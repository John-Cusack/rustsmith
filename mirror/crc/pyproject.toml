[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "crc-rust"
version = "0.1.0"
description = "Pure-Rust CRC library (rustsmith Stage-1 mirror of Nicoretti/crc)"
authors = [{ name = "Nicola Coretti", email = "nico.coretti@gmail.com" }]
maintainers = [{ name = "crc-rust publishers" }]
requires-python = ">=3.9"
readme = "README.md"
license = "BSD-2-Clause"
keywords = ["crc", "checksum", "rust"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: BSD License",
  "Topic :: System :: Checksums",
]

[project.urls]
Homepage = "https://github.com/John-Cusack/crc-rust"
Upstream = "https://github.com/Nicoretti/crc"

[project.scripts]
crc = "crc._crc:main"

# Test config preserved verbatim from the original (frozen oracle owns this).
[tool.coverage.run]
source = [
    "crc",
]

[tool.maturin]
module-name = "crc._crc"
bindings = "pyo3"
features = ["pyo3/extension-module"]
# The reusable Rust core ships inside the sdist as a path dependency
# (verified by `release-prep`: the sdist rebuild test builds the wheel
# from the unpacked sdist with no network checkout).
sdist-include = ["crc-core/**/*", "NOTICE", "release.toml"]
