# Live run config: config/default.toml with real seat identities.
# Use: rustsmith run ... --config config/live.toml
# Seat identities are read from RUSTSMITH_MODELS_CONFIG (default
# config/default.toml), not from --config, so a live run also sets
# RUSTSMITH_MODELS_CONFIG=config/live.toml.

[run]
max_parallel_runs = 3
max_parallel_workers = 16
unit_max_attempts = 3
unit_token_ceiling = 2_000_000
run_token_ceiling = 500_000_000

[oracle]
heldout_divergence_threshold = 0.05
require_zero_skipped = true

[gates]
unsafe_budget_pct = 5.0
unsafe_boundary_only = true
benchmark_noise_floor_pct = 1.0

[optimize]
hotspots_per_round = 8
iterations_per_hotspot = 6
round_gain_threshold_pct = 3.0
max_rounds = 6
enable_pgo = true
round0_enabled = true
round0_mode = "apply"        # apply | suggest
round0_max_changes = 10
min_candidate_ceiling_pct = 1.0
stage2_token_ceiling = 100_000_000
min_gain_per_mtoken = 0.01
require_technique_proposal = true

[optimize.heldout]
workload_divergence_threshold = 0.10
workload_divergence_halt = 0.25
max_divergence_failures_per_run = 2

[optimize.regression]
rss_tolerance_pct = 5.0
alloc_tolerance_pct = 10.0
binary_size_tolerance_pct = 10.0
compile_time_tolerance_pct = 20.0

[optimize.final]
pgo = "gated"   # gated | off, never unconditional
bolt = "gated"
allocator_swap = "candidate"

[measure]
primary_instrument = "cpu_time"
wallclock_confirmation = true
wallclock_repetitions = 30
wallclock_ci = 0.95
quiesce_host_for_wallclock = true
noise_floor_measured = true

[workload]
primary_metric = "wall_time_p50"
require_workload_contract = true

[models]
# Live seat identities. Provider labels must stay distinct across the two
# review seats and never match the implementer (worker), the rule
# assign_reviewers in crates/rustsmith-cli/src/mirror.rs enforces. With these
# labels that rule seats verifier (anthropic) + performance (openai). The run
# path does not pass these labels to assign_reviewers yet (it still uses the
# built-in placeholder map), so until that is wired this table only labels
# the seats in prompts and audit.
# Routes verified 2026-10-06:
#   meta/muse-spark-1.3-contributor  -> omp --model muse-code/muse-spark-1.3-contributor
#   anthropic/claude-opus-5-5        -> claude -p --model claude-opus-5-5 (Claude Code)
#   openai/gpt-6.1-sol               -> omp --model openai-codex/gpt-6.1-sol
architect = { provider = "meta", model = "muse-spark-1.3-contributor" }
verifier = { provider = "anthropic", model = "claude-opus-5-5" }
performance = { provider = "openai", model = "gpt-6.1-sol" }
scope = { provider = "anthropic", model = "claude-opus-5-5" }
worker = { provider = "meta", model = "muse-spark-1.3-contributor" }

[privacy]
training_tier_models = ["worker"]
allow_training_tier_on_private_repos = false
